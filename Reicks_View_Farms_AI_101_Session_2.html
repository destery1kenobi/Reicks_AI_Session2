/* Controlled slide and furniture entrances */
#stage.stage-exit .slide{animation:none!important;opacity:0;transform:translateY(-12px);transition:opacity .15s ease,transform .15s ease}
.slide .chapter-label{animation:presentIn .48s .05s both}
.slide h1,.slide h2{animation:presentIn .58s .12s both}
.slide .hero-rule{animation:ruleIn .58s .2s both;transform-origin:left center}
.slide .lead,.slide .statement,.slide .large-question{animation:presentIn .58s .22s both}
.slide .statement-sub,.slide .question-sub,.slide .small-copy,.slide .prompt-caption{animation:presentIn .58s .31s both}
.slide .agenda-item,.slide .point-list li,.slide .col,.slide .quiz-options button,.slide .parking>div{animation:presentIn .54s both}
.slide .agenda-item:nth-child(1),.slide .point-list li:nth-child(1),.slide .col:nth-child(1),.slide .quiz-options button:nth-child(1),.slide .parking>div:nth-child(1){animation-delay:.24s}
.slide .agenda-item:nth-child(2),.slide .point-list li:nth-child(2),.slide .col:nth-child(2),.slide .quiz-options button:nth-child(2),.slide .parking>div:nth-child(2){animation-delay:.31s}
.slide .agenda-item:nth-child(3),.slide .point-list li:nth-child(3),.slide .quiz-options button:nth-child(3),.slide .parking>div:nth-child(3){animation-delay:.38s}
.slide .agenda-item:nth-child(n+4),.slide .point-list li:nth-child(n+4){animation-delay:.45s}
.slide .prompt-surface,.slide .response,.slide .interactive-body,.slide .prompt-form{animation:presentIn .62s .3s both}
.slide .response.reveal,.slide .interactive-body.reveal{animation:presentIn .4s ease both}
.slide .choice-row,.slide .tab-row,.slide .step-rail,.slide .form-actions{animation:presentIn .55s .22s both}
.slide .source-note{animation:presentIn .5s .48s both}
.slide::after{animation:furrowIn .8s .36s both}
.topbar .brand{animation:furnitureIn .55s both}
.topbar-center{animation:furnitureIn .6s .08s both}
.topbar-actions{animation:furnitureIn .6s .14s both}
.brand-mark i{animation:cropGrow .65s both;transform-origin:bottom}
.brand-mark i:nth-child(2){animation-delay:.1s}
.brand-mark i:nth-child(3){animation-delay:.2s}
.footerbar{animation:footerIn .65s .18s both}
@keyframes presentIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes ruleIn{from{opacity:0;transform:scaleX(.1)}to{opacity:1;transform:scaleX(1)}}
@keyframes furrowIn{from{opacity:0;transform:translateX(32px)}to{opacity:.8;transform:translateX(0)}}
@keyframes furnitureIn{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}
@keyframes footerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

const $ = id => document.getElementById(id);
const stage = $('stage');
const presenterMode = new URLSearchParams(location.search).get('presenter') === '1';
let connectedPresenter = null;
let slideIndex = 0;
let toastTimer;
let printSelection = 'deck';
const roundTimers = new Map();
const selectedCases = new Map();
const selectedPromptLevels = new Map();
const capstoneRounds = capstoneCases.map(caseData => ({
  output: 'A first draft, a revision and two source checks.',
  ...caseData,
  steps: capstoneSteps,
  starter: capstoneRevision
}));

function esc(text) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, char => entities[char]);
}
const lines = text => esc(text).replace(/\n/g, '<br>');
const range = s => s.start + '–' + s.end;
const pointList = items => '<ul class="point-list">' +
  items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>';
const links = items => '<div class="resource-links">' + items.map(
  ([label, url]) => '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>'
).join('') + '</div>';
const column = ([title, text]) => '<div class="col"><h3>' + esc(title) + '</h3><p>' + lines(text) + '</p></div>';
const paragraph = (className, text) => '<p class="' + className + '">' + esc(text) + '</p>';
const heading = title => '<h2 tabindex="-1">' + esc(title) + '</h2>';
const promptSurface = prompt => '<div class="prompt-surface">' + esc(prompt) + '</div>';
const copyButton = '<button class="action-button copy-prompt" type="button" data-copy>Copy prompt</button>';

const workDuration = steps => steps.reduce((total, [minutes]) => total + minutes, 0);
const clockLabel = seconds => Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
const shortList = items => '<ul class="work-source">' + items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>';
const spreadsheetText = rows => rows.map(row => row.join('\t')).join('\n');
const roundSource = round => round.source.join('\n') + (round.sheet ? '\n\n' + spreadsheetText(round.sheet) : '');

const selectedCase = s => selectedCases.get(s) ?? 0;
const availableRounds = s => s.kind === 'capstone' ? capstoneRounds : s.choices ?? [];
const currentRound = (s = S[slideIndex]) => s.round ?? availableRounds(s)[selectedCase(s)];

function choiceButtons(labels, selected, attribute, target, groupLabel, className) {
  return '<div class="choice-row ' + className + '" role="group" aria-label="' + esc(groupLabel) + '">' +
    labels.map((label, index) => '<button type="button"' + (index === selected ? ' class="active"' : '') +
      ' data-' + attribute + '="' + index + '" aria-controls="' + target +
      '" aria-pressed="' + (index === selected) + '">' + esc(label) + '</button>').join('') +
    '</div>';
}

function activateChoice(button, selector) {
  for (const option of stage.querySelectorAll(selector)) {
    const active = option === button;
    option.classList.toggle('active', active);
    option.setAttribute('aria-pressed', String(active));
  }
}

function disclosure(title, text, { copyPrompt, shortcut, extraMarkup = '' } = {}) {
  return '<details class="work-reveal" name="round-disclosure"' +
    (shortcut ? ' data-round-detail="' + shortcut + '"' : '') + '><summary>' + esc(title) + '</summary>' +
    paragraph('work-detail', text) + extraMarkup +
    (copyPrompt ? '<button class="chip-button" type="button" data-copy-starter>' +
      (copyPrompt === 'case' ? 'Copy prompt with case' : 'Copy revision prompt') + '</button>' : '') +
    '</details>';
}

function sampleFlow(flow) {
  return '<figure class="work-flow"><figcaption>Sample process flow</figcaption>' +
    '<ol class="flow-steps">' + flow.steps.map(step => '<li>' + esc(step) + '</li>').join('') + '</ol>' +
    '<ul class="flow-paths">' + flow.paths.map(([answer, step]) =>
      '<li><strong>' + esc(answer) + '</strong> ' + esc(step) + '</li>'
    ).join('') + '</ul></figure>';
}

function invoiceTable([headers, ...rows]) {
  return '<table class="practice-data" aria-label="Fictional invoices"><thead><tr>' +
    headers.map(header => '<th scope="col">' + esc(header) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(row => '<tr>' + row.map(value => '<td>' + esc(value) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

const roundTitle = (s, round) => round.title ? s.title + ' · ' + round.title : s.title;

function workPrint(s, round, worksheet = false) {
  const starter = worksheet && round.starter ? '<div class="worksheet-starter"><strong>' +
      (round.update ? 'Optional revision prompt' : 'Optional prompt starter') +
      '</strong>' + paragraph('', round.starter) + '</div>' : '';
  return heading(roundTitle(s, round)) + paragraph('work-output', round.output) +
    workPlan(round, round.update ? starter : '') + (round.update ? '' : starter) +
    (worksheet ? '<div class="worksheet-writing"><strong>Draft, revision and checks</strong>' +
      '<small class="worksheet-key-note">Find the matching review key at the end of this packet.</small></div>' : '') +
    (round.update ? '<div class="worksheet-update"><strong>Fold here and reveal at minute 7</strong>' +
      paragraph('', round.update) + '</div>' : '');
}

function workPlan(round, printedStarter = '') {
  return '<div class="work-grid"><div class="work-column"><h3>Fictional case</h3>' + shortList(round.source) +
    (round.sheet ? invoiceTable(round.sheet) : '') + printedStarter +
    '</div><div class="work-column"><h3>Work plan</h3><ol class="work-steps">' + round.steps.map(
      ([minutes, task, solo]) => '<li><b>' + minutes + ' min</b><div>' + esc(task) +
        (solo ? '<span class="solo-step"><strong>Working alone?</strong> ' + esc(solo) + '</span>' : '') +
        '</div></li>'
    ).join('') + '</ol></div></div>';
}

function workScreen(round, copyCase) {
  const minutes = workDuration(round.steps);
  return paragraph('work-output', round.output) +
    '<div class="work-shortcuts">' +
    (round.update ? '<button type="button" data-round-shortcut="update">Find new information</button>' : '') +
    '<button type="button" data-round-shortcut="review">Find review key</button></div>' +
    workPlan(round) +
    '<div class="work-controls"><div class="round-clock">' +
    '<output id="roundTime" role="timer" aria-label="Time remaining">' + clockLabel(minutes * 60) + '</output>' +
    '<button class="action-button" type="button" data-round-clock>Start timer</button>' +
    '<button class="chip-button" type="button" data-round-reset hidden>Reset</button>' +
    '</div>' + (copyCase ? '<button class="chip-button" type="button" data-copy-case>Copy case</button>' : '') +
    (round.sheet ? '<button class="chip-button" type="button" data-copy-spreadsheet>Copy spreadsheet data</button>' : '') + '</div>' +
    '<div class="work-disclosures">' +
    (round.update ? disclosure('New information · after 7 min', round.update, { shortcut: 'update' }) : '') +
    (round.starter ? disclosure(round.update ? 'Revision prompt' : 'Prompt starter', round.starter,
      { copyPrompt: round.update ? 'revision' : 'case' }) : '') +
    disclosure('Review key', round.review, { shortcut: 'review', extraMarkup: round.flow ? sampleFlow(round.flow) : '' }) +
    (round.extra ? disclosure('Finished early?', round.extra) : '') +
    '</div>';
}

function demoSamples(s, forPrint) {
  const samples = [{ label: 'sample result', text: s.sampleResult }];
  if (s.sampleInput) samples.unshift(s.sampleInput);
  return '<div class="demo-samples">' + samples.map(({ label, text }) => {
    const body = paragraph('work-detail demo-detail', text);
    if (forPrint) {
      const printLabel = label[0].toUpperCase() + label.slice(1);
      return '<section class="demo-sample"><h3>' + esc(printLabel) + '</h3>' + body + '</section>';
    }
    return '<details class="demo-sample"><summary>Show ' + esc(label) + '</summary>' + body + '</details>';
  }).join('') + '</div>';
}

function examplePrompt([prompt, change]) {
  return promptSurface(prompt) + paragraph('prompt-caption example-change', change);
}

function exampleMarkup(example) {
  const level = selectedPromptLevels.get(example) ?? 0;
  return '<h3 class="example-title">' + esc(example.title) + '</h3>' + paragraph('example-source', example.source) +
    choiceButtons(promptLevels, level, 'prompt-level', 'examplePrompt', 'Prompt version', 'example-levels') +
    '<div id="examplePrompt" aria-live="polite" aria-atomic="true">' + examplePrompt(example.variants[level]) +
    '</div><button type="button" class="chip-button example-copy" data-copy-example>Copy prompt with case</button>';
}

function printExample(s, example) {
  return '<section class="slide prompt-example">' + paragraph('chapter-label', s.section) + heading(example.title) +
    paragraph('example-source', example.source) + '<div class="example-print">' +
    example.variants.map(([prompt, change], index) => '<section><h3>' + esc(promptLevels[index]) +
      '</h3>' + paragraph('example-print-prompt', prompt) + paragraph('example-change', change) + '</section>'
    ).join('') + '</div></section>';
}

function slideMarkup(s, forPrint = false) {
  const label = paragraph('chapter-label', s.kind === 'cover' ? 'Session 2' : s.section);
  let className = 'slide';
  let body;
  switch (s.kind) {
    case 'cover':
    case 'dark':
      className += s.kind === 'cover' ? ' dark cover' : ' dark';
      body = (s.kind === 'cover' ? '<div class="field-art" aria-hidden="true"></div>' : '') +
        label + '<h1 tabindex="-1">' + esc(s.title) + '</h1><div class="hero-rule" aria-hidden="true"></div>' +
        paragraph('lead', s.lead) + (s.sub ? paragraph('subline', s.sub) : '');
      break;
    case 'agenda':
      body = label + heading(s.title) + '<div class="agenda">' + s.items.map(
        ([time, item]) => '<div class="agenda-item"><b>' + esc(time) + '</b><span>' + esc(item) + '</span></div>'
      ).join('') + '</div>' +
        (s.practiceSheets && !forPrint ? '<button type="button" class="chip-button practice-print-button" data-print-practice>Print practice sheets</button>' : '');
      break;
    case 'compare':
      body = label + heading(s.title) + '<div class="two-col">' + column(s.left) + column(s.right) + '</div>';
      break;
    case 'list':
      body = label + heading(s.title) + pointList(s.items) + (s.cue ? paragraph('prompt-caption', s.cue) : '') +
        (s.links ? links(s.links) : '');
      break;
    case 'demo':
      if (s.prompt.includes('\n1. ')) className += ' stepped-demo';
      body = label + '<span class="demo-phase">' + esc(s.label) + '</span>' + heading(s.title) +
        '<div class="demo-input">' + paragraph('prompt-label', 'WHAT I WOULD TYPE') +
        promptSurface(s.prompt) + '<div class="prompt-actions">' + copyButton +
        (s.sampleInput ? '<button class="chip-button" type="button" data-copy="with-input">Copy with ' +
          esc(s.sampleInput.label) + '</button>' : '') +
        '</div></div>' + paragraph('prompt-caption', s.cue) + demoSamples(s, forPrint);
      break;
    case 'prompt-examples':
      className += ' prompt-example';
      body = label + heading(s.title) +
        choiceButtons(promptExamples.map(example => example.tab), selectedCase(s), 'example', 'exampleCase',
          'Choose an example', 'case-buttons example-cases') +
        '<div id="exampleCase">' + exampleMarkup(promptExamples[selectedCase(s)]) + '</div>';
      break;
    case 'check':
      body = label + heading(s.title) + paragraph('lead review-lead', s.lead) + pointList(s.items);
      if (!forPrint) {
        body += '<details class="review-details"><summary class="action-button">Check your review</summary>' +
          paragraph('response', s.answer) + '</details>';
      }
      break;
    case 'round':
      className += ' work-slide';
      body = label + (forPrint ? workPrint(s, s.round) : heading(s.title) + workScreen(s.round, s.round.copy !== false));
      break;
    case 'choice-round':
    case 'capstone':
      className += ' work-slide capstone';
      if (s.kind === 'capstone' && forPrint) {
        body = label + heading(s.title) + '<div class="practice-print">' + capstoneCases.map(caseData =>
          '<section><h3>' + esc(caseData.title) + '</h3>' + paragraph('', caseData.source.join(' ')) +
          paragraph('', 'New information · ' + caseData.update) + '</section>'
        ).join('') + '</div>';
        break;
      }
      body = label + heading(s.title) +
        choiceButtons(availableRounds(s).map(round => round.title), selectedCase(s), 'case', 'casePanel',
          'Choose a practice case', 'case-buttons') +
        '<div id="casePanel" class="scenario-panel">' + workScreen(currentRound(s), true) + '</div>';
      break;
    case 'question':
      body = label + heading(s.title) + paragraph('large-question', s.text) + paragraph('question-sub', s.sub) +
        (s.cue ? paragraph('prompt-caption', s.cue) : '');
      break;
  }
  return '<section class="' + className + '">' + body + '</section>';
}

function showToast(message) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

async function copyText(button, prompt, label) {
  try {
    await navigator.clipboard.writeText(prompt);
  } catch {
    const field = document.createElement('textarea');
    field.className = 'visually-hidden';
    field.value = prompt;
    field.setAttribute('aria-label', 'Prompt text');
    button.after(field);
    field.select();
    if (!document.execCommand('copy')) {
      field.addEventListener('blur', () => field.remove(), { once: true });
      showToast(label + ' selected. Use Ctrl+C or Command+C to copy.');
      return;
    }
    field.remove();
    button.focus({ preventScroll: true });
  }
  showToast(label + ' copied');
}

function updateRoundClock() {
  const clock = $('roundTime');
  if (!clock) return;
  const round = currentRound();
  const duration = workDuration(round.steps) * 60;
  const timer = roundTimers.get(slideIndex);
  const seconds = timer?.until ? Math.max(0, Math.ceil((timer.until - Date.now()) / 1000)) :
    timer?.remaining ?? duration;
  if (timer?.until && seconds === 0) {
    timer.until = null;
    timer.remaining = 0;
    showToast('Time is up');
  }
  const nextTime = clockLabel(seconds);
  if (clock.value !== nextTime) clock.value = nextTime;
  const start = stage.querySelector('[data-round-clock]');
  const nextLabel = timer?.until ? 'Pause' : seconds > 0 && seconds < duration ? 'Resume' : 'Start timer';
  if (start.textContent !== nextLabel) start.textContent = nextLabel;
  stage.querySelector('[data-round-reset]').hidden = !timer;
  const elapsed = duration - seconds;
  let cutoff = 0;
  for (const [index, item] of [...stage.querySelectorAll('.work-steps li')].entries()) {
    const beginning = cutoff;
    cutoff += round.steps[index][0] * 60;
    item.toggleAttribute('data-current', Boolean(timer && elapsed >= beginning && elapsed < cutoff));
  }
}

function toggleRoundClock() {
  const duration = workDuration(currentRound().steps) * 60;
  const previous = roundTimers.get(slideIndex);
  if (previous?.until) {
    roundTimers.set(slideIndex, { remaining: Math.max(0, Math.ceil((previous.until - Date.now()) / 1000)) });
  } else {
    const remaining = previous?.remaining || duration;
    roundTimers.set(slideIndex, { until: Date.now() + remaining * 1000 });
  }
  updateRoundClock();
}

function hashIndex() {
  const match = location.hash.match(/^#slide=(\d+)$/);
  const index = match ? Number(match[1]) - 1 : 0;
  return Math.max(0, Math.min(index, S.length - 1));
}

function drawPresenter(s) {
  $('presenterTitle').textContent = s.title;
  $('presenterMeta').textContent = s.section + ' · ' + range(s);
  $('presenterNotes').textContent = s.notes;
  $('presenterNext').textContent = S[slideIndex + 1]?.title ?? 'End of session';
  $('presenterCount').textContent = (slideIndex + 1) + ' / ' + S.length;
  $('presenterPrev').disabled = slideIndex === 0;
  $('presenterNextButton').disabled = slideIndex === S.length - 1;
}

function render({ focus = false } = {}) {
  const s = S[slideIndex];
  if (presenterMode) {
    drawPresenter(s);
    return;
  }
  stage.innerHTML = slideMarkup(s);
  stage.scrollTop = 0;
  updateRoundClock();
  $('chapter').textContent = s.section;
  $('timing').textContent = range(s);
  $('timing').classList.add('timing');
  $('slideNumber').textContent = String(slideIndex + 1).padStart(2, '0') + ' / ' + S.length;
  $('prev').disabled = slideIndex === 0;
  $('next').disabled = slideIndex === S.length - 1;
  $('progress').style.width = ((slideIndex + 1) / S.length * 100) + '%';
  $('notesTime').textContent = range(s);
  $('notesSlide').textContent = s.section;
  $('notesText').textContent = s.notes;
  for (const button of $('outlineItems').querySelectorAll('[data-slide]')) {
    const active = Number(button.dataset.slide) === slideIndex;
    button.classList.toggle('active', active);
    if (active) button.setAttribute('aria-current', 'true');
    else button.removeAttribute('aria-current');
  }
  if (focus) stage.querySelector('h1, h2')?.focus({ preventScroll: true });
  if (connectedPresenter && !connectedPresenter.closed) {
    connectedPresenter.postMessage({ type: 'reicks-session2-slide', index: slideIndex }, '*');
  }
}

function goTo(index, focus = false) {
  if (!Number.isInteger(index) || index < 0 || index >= S.length || index === slideIndex) return;
  if (presenterMode && opener && !opener.closed) {
    opener.postMessage({ type: 'reicks-session2-go', index }, '*');
  } else {
    history.pushState(null, '', '#slide=' + (index + 1));
    slideIndex = index;
    render({ focus });
  }
}

function setUpDrawer(dialogId, buttonId) {
  const dialog = $(dialogId);
  const button = $(buttonId);
  button.addEventListener('click', () => {
    dialog.showModal();
    button.setAttribute('aria-expanded', 'true');
    dialog.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
  });
  dialog.querySelector('.close').addEventListener('click', () => dialog.close());
  dialog.addEventListener('close', () => button.setAttribute('aria-expanded', 'false'));
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const bounds = dialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right) dialog.close();
  });
}

function preparePrint() {
  const printDeck = $('printDeck');
  if (printDeck.dataset.selection === printSelection) return;
  printDeck.dataset.selection = printSelection;
  if (printSelection === 'deck') {
    printDeck.innerHTML = S.map(s => {
      if (s.kind === 'prompt-examples') return promptExamples.map(example => printExample(s, example)).join('');
      if (s.kind === 'choice-round') {
        return s.choices.map(round => '<section class="slide work-slide">' +
          paragraph('chapter-label', s.section) + workPrint(s, round) + '</section>').join('');
      }
      return slideMarkup(s, true);
    }).join('');
    return;
  }
  const practice = S.flatMap(s => (s.round ? [s.round] : availableRounds(s)).map(round => [s, round]));
  const sheets = practice.map(([s, round]) =>
    '<section class="slide worksheet">' + paragraph('chapter-label', 'Reicks View Farms · Session 2 · ' + workDuration(round.steps) + ' min') +
    workPrint(s, round, true) + '</section>'
  ).join('');
  let keys = '';
  for (let offset = 0; offset < practice.length; offset += 5) {
    keys += '<section class="slide print-review-sheet">' + paragraph('chapter-label', 'Reicks View Farms · Session 2') +
      heading('Review keys') + paragraph('print-review-intro', 'Compare these notes with your work after you finish each case.') +
      '<div class="print-review-list">' + practice.slice(offset, offset + 5).map(([s, round]) =>
        '<section><h3>' + esc(roundTitle(s, round)) + '</h3>' + paragraph('', round.review) +
        (round.flow ? sampleFlow(round.flow) : '') + '</section>'
      ).join('') + '</div></section>';
  }
  printDeck.innerHTML = sheets + keys;
}

function printPresentation(selection) {
  printSelection = selection;
  preparePrint();
  window.print();
}

function configureDeck() {
  $('home').addEventListener('click', () => goTo(0, true));
  $('prev').addEventListener('click', () => goTo(slideIndex - 1));
  $('next').addEventListener('click', () => goTo(slideIndex + 1));
  $('outlineItems').innerHTML = S.map((s, index) =>
    (s.section !== S[index - 1]?.section ? '<h3 class="outline-section">' + esc(s.section) + '</h3>' : '') +
    '<button class="outline-item" type="button" data-slide="' + index + '"><span>' +
    esc(range(s)) + '</span>' + esc(s.title) + '</button>'
  ).join('');
  $('outlineItems').addEventListener('click', event => {
    const button = event.target.closest('button[data-slide]');
    if (!button) return;
    $('outline').close();
    goTo(Number(button.dataset.slide), true);
  });
  setUpDrawer('outline', 'outlineButton');
  setUpDrawer('notes', 'notesButton');
  stage.addEventListener('click', event => {
    const copy = event.target.closest('[data-copy]');
    if (copy) {
      const s = S[slideIndex];
      const prompt = copy.dataset.copy === 'with-input' ? s.prompt + '\n\n' + s.sampleInput.text : s.prompt;
      void copyText(copy, prompt, 'Prompt');
      return;
    }
    const exampleButton = event.target.closest('[data-example]');
    if (exampleButton) {
      selectedCases.set(S[slideIndex], Number(exampleButton.dataset.example));
      activateChoice(exampleButton, '[data-example]');
      $('exampleCase').innerHTML = exampleMarkup(promptExamples[selectedCase(S[slideIndex])]);
      return;
    }
    const levelButton = event.target.closest('[data-prompt-level]');
    if (levelButton) {
      const example = promptExamples[selectedCase(S[slideIndex])];
      const level = Number(levelButton.dataset.promptLevel);
      selectedPromptLevels.set(example, level);
      activateChoice(levelButton, '[data-prompt-level]');
      $('examplePrompt').innerHTML = examplePrompt(example.variants[level]);
      return;
    }
    const copyExample = event.target.closest('[data-copy-example]');
    if (copyExample) {
      const example = promptExamples[selectedCase(S[slideIndex])];
      const [prompt] = example.variants[selectedPromptLevels.get(example) ?? 0];
      void copyText(copyExample, prompt + '\n\nFictional case\n' + example.source, 'Prompt');
      return;
    }
    const copyCase = event.target.closest('[data-copy-case]');
    if (copyCase) {
      const round = currentRound();
      void copyText(copyCase, roundSource(round) + '\n\n' + round.output, 'Case');
      return;
    }
    const copySpreadsheet = event.target.closest('[data-copy-spreadsheet]');
    if (copySpreadsheet) {
      void copyText(copySpreadsheet, spreadsheetText(currentRound().sheet), 'Spreadsheet data');
      return;
    }
    const starter = event.target.closest('[data-copy-starter]');
    if (starter) {
      const round = currentRound();
      const prompt = round.update ? round.starter : round.starter + '\n\n' + roundSource(round);
      void copyText(starter, prompt, 'Prompt');
      return;
    }
    if (event.target.closest('[data-round-clock]')) {
      toggleRoundClock();
      return;
    }
    if (event.target.closest('[data-round-reset]')) {
      roundTimers.delete(slideIndex);
      updateRoundClock();
      stage.querySelector('[data-round-clock]').focus();
      return;
    }
    if (event.target.closest('[data-print-practice]')) {
      printPresentation('practice');
      return;
    }
    const shortcut = event.target.closest('[data-round-shortcut]');
    if (shortcut) {
      const control = stage.querySelector('[data-round-detail="' + shortcut.dataset.roundShortcut + '"] summary');
      control.focus({ preventScroll: true });
      control.scrollIntoView({ block: 'center' });
      return;
    }
    const button = event.target.closest('[data-case]');
    if (!button) return;
    selectedCases.set(S[slideIndex], Number(button.dataset.case));
    activateChoice(button, '[data-case]');
    $('casePanel').innerHTML = workScreen(currentRound(), true);
    updateRoundClock();
  });
  stage.addEventListener('toggle', event => {
    if (event.target.matches('.work-reveal[open], details.demo-sample[open]')) {
      event.target.scrollIntoView({ block: 'nearest' });
    }
  }, true);
  $('presenterButton').addEventListener('click', () => {
    const url = new URL(location.href);
    url.searchParams.set('presenter', '1');
    url.hash = 'slide=' + (slideIndex + 1);
    connectedPresenter = window.open(url.href, 'ReicksSession2Presenter', 'popup,width=690,height=760');
    if (!connectedPresenter) showToast('Allow pop-ups or open Facilitator for the notes.');
    else connectedPresenter.focus();
  });
  addEventListener('beforeprint', preparePrint);
  addEventListener('afterprint', () => { printSelection = 'deck'; });
  $('printButton').addEventListener('click', () => printPresentation('deck'));
  setInterval(updateRoundClock, 250);
}

addEventListener('message', event => {
  const { type, index } = event.data ?? {};
  if (!Number.isInteger(index) || index < 0 || index >= S.length) return;
  if (presenterMode && event.source === opener && type === 'reicks-session2-slide') {
    slideIndex = index;
    history.replaceState(null, '', '#slide=' + (index + 1));
    render();
  } else if (!presenterMode && event.source === connectedPresenter && type === 'reicks-session2-go') {
    goTo(index);
  }
});

addEventListener('hashchange', () => {
  const index = hashIndex();
  if (index === slideIndex) return;
  slideIndex = index;
  render();
});

addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
    document.querySelector('dialog[open]') || event.target.closest?.('input, textarea, [contenteditable]')) return;
  const destinations = { ArrowLeft: slideIndex - 1, ArrowRight: slideIndex + 1, Home: 0, End: S.length - 1 };
  if (!Object.hasOwn(destinations, event.key)) return;
  event.preventDefault();
  goTo(destinations[event.key], true);
});

slideIndex = hashIndex();
if (presenterMode) {
  document.body.classList.add('presenter-mode');
  $('presenterView').hidden = false;
  $('presenterPrev').addEventListener('click', () => goTo(slideIndex - 1));
  $('presenterNextButton').addEventListener('click', () => goTo(slideIndex + 1));
} else {
  configureDeck();
}
render();
</script>
</body>
</html>
